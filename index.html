<!DOCTYPE html>
<html lang="ru" data-theme="light" data-style="lime">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202720">
<title>VibeOFF — Java-тренажёр без автопилота · v1.0</title>
<meta name="author" content="Антон Сынушкин">
<meta name="version" content="1.0">
<link rel="icon" type="image/png" href="assets/img/vibeoff-64.png">
<link rel="apple-touch-icon" href="assets/img/vibeoff-128.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>try{var p=JSON.parse(localStorage.getItem('java-sprav:profiles'))||{cur:'p0'};var s=JSON.parse(localStorage.getItem(p.cur==='p0'?'java-sprav:v1':'java-sprav:v1:'+p.cur))||{};var t=s.theme||'light';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.dataset.style=s.style||'lime'}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-logo"><img src="assets/img/vibeoff-128.png" alt=""></div><div><div class="brand-title">VibeOFF</div><div class="brand-sub">Выруби автопилот. Вруби мозги</div></div></div>
    <div class="profile" id="profile"></div>
    <div class="side-links" id="sideLinks"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><a href="#/about" data-hint="О приложении, автор и обратная связь">Антон Сынушкин</a> · <a href="javascript:void 0" data-changes data-hint="Что нового: история версий">v1.0</a></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Меню" data-hint="Открыть меню: модули и темы">☰</button>
      <div class="search">
        <svg class="s-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Поиск по вопросам и ответам…">
        <kbd data-hint="Нажмите / или Ctrl+K, чтобы начать поиск">/</kbd>
        <div class="s-drop" id="sdrop"></div>
      </div>
      <div class="tb-right">
        <span class="tb-label">Уровень:</span><div class="seg" id="lvSeg"></div>
        <button class="icon-btn" id="rndBtn" aria-label="Случайный вопрос" data-hint="Случайный вопрос из любой темы (клавиша R)">🎲</button>
        <button class="icon-btn" id="themeBtn" aria-label="Оформление" data-hint="Оформление: светлая или тёмная тема и стиль">◐</button>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="lightbox" id="lb">
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>
  <div class="lb-bar" id="lbInfo"></div>
  <button class="lb-btn lb-prev" id="lbPrev">‹</button><button class="lb-btn lb-next" id="lbNext">›</button>
  <button class="lb-close" id="lbClose">✕</button>
</div>
<div class="nav-scrim" id="navScrim"></div>
<nav class="bottom-bar" id="bottomBar"></nav>
<div class="toast" id="toast"></div>

<script src="assets/vendor/highlight.min.js"></script>
<script src="assets/vendor/dockerfile.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/gitlab.js"></script>
<script src="assets/vendor/sql-asm.js"></script>
<script src="assets/js/sqllab-data.js"></script>
<script src="assets/js/sqllab.js"></script>
<script src="assets/js/idea.js"></script>
<script src="assets/js/tools.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
