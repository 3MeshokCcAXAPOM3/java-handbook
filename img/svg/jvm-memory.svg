<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, Inter, Arial, sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f6bed"/></marker></defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#24262b">Память JVM: что где хранится</text>

  <!-- стеки -->
  <rect x="24" y="64" width="292" height="350" rx="16" fill="#fcf0dc" stroke="#d98a1c" stroke-width="1.5"/>
  <text x="170" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#9a5c06">Стеки потоков</text>
  <text x="170" y="109" text-anchor="middle" font-size="12.5" fill="#6b6f78">у каждого потока свой · размер -Xss</text>
  <rect x="38" y="122" width="128" height="278" rx="10" fill="#fff" stroke="#e6c48f"/>
  <text x="102" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#24262b">поток main</text>
  <rect x="48" y="154" width="108" height="96" rx="7" fill="#fff7ea" stroke="#d98a1c"/>
  <text x="56" y="172" font-size="12.5" font-weight="700" fill="#9a5c06">process()</text>
  <text x="56" y="192" font-size="12" fill="#24262b" font-family="Consolas, monospace">int qty = 2</text>
  <text x="56" y="212" font-size="12" fill="#24262b" font-family="Consolas, monospace">Order o ●</text>
  <text x="56" y="232" font-size="12" fill="#24262b" font-family="Consolas, monospace">String s ●</text>
  <rect x="48" y="258" width="108" height="64" rx="7" fill="#fff7ea" stroke="#d98a1c"/>
  <text x="56" y="276" font-size="12.5" font-weight="700" fill="#9a5c06">main()</text>
  <text x="56" y="296" font-size="12" fill="#24262b" font-family="Consolas, monospace">args ●</text>
  <text x="102" y="350" text-anchor="middle" font-size="12" fill="#6b6f78">фрейм на вызов:</text>
  <text x="102" y="366" text-anchor="middle" font-size="12" fill="#6b6f78">локальные переменные,</text>
  <text x="102" y="382" text-anchor="middle" font-size="12" fill="#6b6f78">ссылки, адрес возврата</text>
  <rect x="176" y="122" width="128" height="278" rx="10" fill="#fff" stroke="#e6c48f"/>
  <text x="240" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#24262b">поток worker</text>
  <rect x="186" y="154" width="108" height="76" rx="7" fill="#fff7ea" stroke="#d98a1c"/>
  <text x="194" y="172" font-size="12.5" font-weight="700" fill="#9a5c06">handle()</text>
  <text x="194" y="192" font-size="12" fill="#24262b" font-family="Consolas, monospace">long id = 7</text>
  <text x="194" y="212" font-size="12" fill="#24262b" font-family="Consolas, monospace">Order o ●</text>
  <text x="240" y="268" text-anchor="middle" font-size="12" fill="#6b6f78">глубокая рекурсия →</text>
  <text x="240" y="284" text-anchor="middle" font-size="12" fill="#c2456b" font-weight="600">StackOverflowError</text>
  <text x="240" y="322" text-anchor="middle" font-size="12" fill="#6b6f78">стек не нужно чистить:</text>
  <text x="240" y="338" text-anchor="middle" font-size="12" fill="#6b6f78">фрейм исчезает</text>
  <text x="240" y="354" text-anchor="middle" font-size="12" fill="#6b6f78">при выходе из метода</text>

  <!-- куча -->
  <rect x="336" y="64" width="600" height="350" rx="16" fill="#e9edfe" stroke="#4f6bed" stroke-width="1.5"/>
  <text x="636" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#3149c4">Куча (Heap) — общая для всех потоков</text>
  <text x="636" y="109" text-anchor="middle" font-size="12.5" fill="#6b6f78">все объекты и массивы · размер -Xms / -Xmx (в контейнере -XX:MaxRAMPercentage) · чистит GC</text>
  <rect x="352" y="122" width="300" height="278" rx="12" fill="#fff" stroke="#9fb0f5"/>
  <text x="502" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#24262b">Young generation</text>
  <rect x="364" y="154" width="276" height="142" rx="9" fill="#e3f5ec" stroke="#1f9d6b"/>
  <text x="376" y="174" font-size="13" font-weight="700" fill="#137a52">Eden — здесь рождаются объекты</text>
  <rect x="380" y="190" width="104" height="40" rx="8" fill="#1f9d6b"/>
  <text x="432" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Order</text>
  <rect x="500" y="190" width="124" height="40" rx="8" fill="#1f9d6b"/>
  <text x="562" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">ArrayList</text>
  <rect x="380" y="242" width="104" height="40" rx="8" fill="#9ad4b8"/>
  <text x="432" y="267" text-anchor="middle" font-size="12.5" fill="#24262b">мусор</text>
  <rect x="364" y="306" width="132" height="80" rx="9" fill="#f2f9f5" stroke="#1f9d6b"/>
  <text x="430" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#137a52">Survivor S0</text>
  <text x="430" y="356" text-anchor="middle" font-size="12" fill="#6b6f78">выжившие,</text>
  <text x="430" y="372" text-anchor="middle" font-size="12" fill="#6b6f78">растёт возраст</text>
  <rect x="508" y="306" width="132" height="80" rx="9" fill="#f2f9f5" stroke="#1f9d6b"/>
  <text x="574" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#137a52">Survivor S1</text>
  <text x="574" y="356" text-anchor="middle" font-size="12" fill="#6b6f78">копируются</text>
  <text x="574" y="372" text-anchor="middle" font-size="12" fill="#6b6f78">туда-обратно</text>
  <rect x="666" y="122" width="256" height="278" rx="12" fill="#fff" stroke="#9fb0f5"/>
  <text x="794" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#24262b">Old generation</text>
  <text x="794" y="162" text-anchor="middle" font-size="12" fill="#6b6f78">долгоживущие объекты</text>
  <rect x="686" y="178" width="216" height="40" rx="8" fill="#4f6bed"/>
  <text x="794" y="203" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">кеш, бины Spring, пулы</text>
  <rect x="686" y="228" width="216" height="40" rx="8" fill="#7d93f2"/>
  <text x="794" y="253" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">пул строк: "ABC"</text>
  <rect x="686" y="278" width="216" height="52" rx="8" fill="#a9b8ff"/>
  <text x="794" y="299" text-anchor="middle" font-size="12.5" font-weight="600" fill="#24262b">объекты Class&lt;?&gt;</text>
  <text x="794" y="317" text-anchor="middle" font-size="12" fill="#24262b">со static-полями</text>
  <text x="794" y="358" text-anchor="middle" font-size="12" fill="#6b6f78">объекты переходят сюда,</text>
  <text x="794" y="374" text-anchor="middle" font-size="12" fill="#6b6f78">пережив несколько сборок</text>

  <!-- ссылки из стеков -->
  <path d="M146 208 C 250 208, 300 170, 380 205" fill="none" stroke="#4f6bed" stroke-width="2" marker-end="url(#a)"/>
  <path d="M284 208 C 330 214, 340 214, 380 214" fill="none" stroke="#4f6bed" stroke-width="2" marker-end="url(#a)"/>
  <path d="M146 228 H171 V423 H659 V248 H682" fill="none" stroke="#4f6bed" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#a)"/>

  <!-- нативная память -->
  <rect x="24" y="432" width="912" height="172" rx="16" fill="#f6f5f1" stroke="#9a9ea6" stroke-width="1.5"/>
  <text x="480" y="458" text-anchor="middle" font-size="16" font-weight="700" fill="#24262b">Нативная память процесса (вне кучи) — тоже входит в лимит контейнера</text>
  <rect x="40" y="474" width="212" height="114" rx="11" fill="#fbe6ed" stroke="#c2456b"/>
  <text x="146" y="498" text-anchor="middle" font-size="14" font-weight="700" fill="#a3304f">Metaspace</text>
  <text x="146" y="520" text-anchor="middle" font-size="12.5" fill="#24262b">метаданные классов,</text>
  <text x="146" y="537" text-anchor="middle" font-size="12.5" fill="#24262b">байт-код методов</text>
  <text x="146" y="568" text-anchor="middle" font-size="11.5" fill="#6b6f78" font-family="Consolas, monospace">-XX:MaxMetaspaceSize</text>
  <rect x="264" y="474" width="212" height="114" rx="11" fill="#fbe6ed" stroke="#c2456b"/>
  <text x="370" y="498" text-anchor="middle" font-size="14" font-weight="700" fill="#a3304f">Code Cache</text>
  <text x="370" y="520" text-anchor="middle" font-size="12.5" fill="#24262b">машинный код,</text>
  <text x="370" y="537" text-anchor="middle" font-size="12.5" fill="#24262b">скомпилированный JIT</text>
  <text x="370" y="568" text-anchor="middle" font-size="11.5" fill="#6b6f78" font-family="Consolas, monospace">-XX:ReservedCodeCacheSize</text>
  <rect x="488" y="474" width="212" height="114" rx="11" fill="#fbe6ed" stroke="#c2456b"/>
  <text x="594" y="498" text-anchor="middle" font-size="14" font-weight="700" fill="#a3304f">Direct-буферы</text>
  <text x="594" y="520" text-anchor="middle" font-size="12.5" fill="#24262b">NIO, Netty, сеть</text>
  <text x="594" y="537" text-anchor="middle" font-size="12.5" fill="#24262b">и файловый ввод-вывод</text>
  <text x="594" y="568" text-anchor="middle" font-size="11.5" fill="#6b6f78" font-family="Consolas, monospace">-XX:MaxDirectMemorySize</text>
  <rect x="712" y="474" width="208" height="114" rx="11" fill="#fbe6ed" stroke="#c2456b"/>
  <text x="816" y="498" text-anchor="middle" font-size="14" font-weight="700" fill="#a3304f">Прочее</text>
  <text x="816" y="520" text-anchor="middle" font-size="12.5" fill="#24262b">стеки потоков,</text>
  <text x="816" y="537" text-anchor="middle" font-size="12.5" fill="#24262b">структуры GC и JIT</text>
  <text x="816" y="568" text-anchor="middle" font-size="11.5" fill="#6b6f78" font-family="Consolas, monospace">jcmd PID VM.native_memory</text>
</svg>
