<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, Inter, Arial, sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#24262b">Аномалии параллельных транзакций и уровни изоляции</text>

  <!-- примеры -->
  <g font-size="12.5">
    <rect x="24" y="62" width="216" height="200" rx="12" fill="#f6f5f1"/>
    <text x="40" y="86" font-size="14" font-weight="700" fill="#24262b">Dirty read</text>
    <text x="40" y="106" fill="#6b6f78">чтение незакоммиченного</text>
    <text x="40" y="132" fill="#4f6bed" font-family="Consolas, monospace">T1: UPDATE bal = 0</text>
    <text x="40" y="152" fill="#d98a1c" font-family="Consolas, monospace">T2: SELECT bal → 0</text>
    <text x="40" y="172" fill="#4f6bed" font-family="Consolas, monospace">T1: ROLLBACK</text>
    <text x="40" y="198" fill="#c2456b" font-weight="700">T2 видел данные,</text>
    <text x="40" y="216" fill="#c2456b" font-weight="700">которых не было</text>

    <rect x="252" y="62" width="216" height="200" rx="12" fill="#f6f5f1"/>
    <text x="268" y="86" font-size="14" font-weight="700" fill="#24262b">Non-repeatable read</text>
    <text x="268" y="106" fill="#6b6f78">строка изменилась</text>
    <text x="268" y="132" fill="#d98a1c" font-family="Consolas, monospace">T2: SELECT bal → 100</text>
    <text x="268" y="152" fill="#4f6bed" font-family="Consolas, monospace">T1: UPDATE bal = 50</text>
    <text x="268" y="172" fill="#4f6bed" font-family="Consolas, monospace">T1: COMMIT</text>
    <text x="268" y="192" fill="#d98a1c" font-family="Consolas, monospace">T2: SELECT bal → 50</text>
    <text x="268" y="218" fill="#c2456b" font-weight="700">повторное чтение даёт</text>
    <text x="268" y="236" fill="#c2456b" font-weight="700">другой результат</text>

    <rect x="480" y="62" width="216" height="200" rx="12" fill="#f6f5f1"/>
    <text x="496" y="86" font-size="14" font-weight="700" fill="#24262b">Phantom read</text>
    <text x="496" y="106" fill="#6b6f78">появились новые строки</text>
    <text x="496" y="132" fill="#d98a1c" font-family="Consolas, monospace">T2: COUNT(*) → 3</text>
    <text x="496" y="152" fill="#4f6bed" font-family="Consolas, monospace">T1: INSERT …</text>
    <text x="496" y="172" fill="#4f6bed" font-family="Consolas, monospace">T1: COMMIT</text>
    <text x="496" y="192" fill="#d98a1c" font-family="Consolas, monospace">T2: COUNT(*) → 4</text>
    <text x="496" y="218" fill="#c2456b" font-weight="700">набор строк по тому же</text>
    <text x="496" y="236" fill="#c2456b" font-weight="700">условию изменился</text>

    <rect x="708" y="62" width="228" height="200" rx="12" fill="#f6f5f1"/>
    <text x="724" y="86" font-size="14" font-weight="700" fill="#24262b">Lost update</text>
    <text x="724" y="106" fill="#6b6f78">перезапись чужого изменения</text>
    <text x="724" y="132" fill="#4f6bed" font-family="Consolas, monospace">T1: читает stock = 10</text>
    <text x="724" y="152" fill="#d98a1c" font-family="Consolas, monospace">T2: читает stock = 10</text>
    <text x="724" y="172" fill="#4f6bed" font-family="Consolas, monospace">T1: пишет 9, COMMIT</text>
    <text x="724" y="192" fill="#d98a1c" font-family="Consolas, monospace">T2: пишет 9, COMMIT</text>
    <text x="724" y="218" fill="#c2456b" font-weight="700">продано 2, списано 1</text>
    <text x="724" y="236" fill="#6b6f78">лечится @Version или FOR UPDATE</text>
  </g>

  <!-- матрица -->
  <g font-size="13.5">
    <rect x="24" y="284" width="230" height="40" rx="8" fill="#24262b"/><text x="40" y="309" fill="#fff" font-weight="700">Уровень изоляции</text>
    <rect x="260" y="284" width="164" height="40" rx="8" fill="#24262b"/><text x="342" y="309" text-anchor="middle" fill="#fff" font-weight="700">Dirty read</text>
    <rect x="430" y="284" width="164" height="40" rx="8" fill="#24262b"/><text x="512" y="309" text-anchor="middle" fill="#fff" font-weight="700">Non-repeatable</text>
    <rect x="600" y="284" width="164" height="40" rx="8" fill="#24262b"/><text x="682" y="309" text-anchor="middle" fill="#fff" font-weight="700">Phantom</text>
    <rect x="770" y="284" width="166" height="40" rx="8" fill="#24262b"/><text x="853" y="309" text-anchor="middle" fill="#fff" font-weight="700">Serialization</text>

    <rect x="24" y="330" width="230" height="44" rx="8" fill="#f6f5f1"/><text x="40" y="357" font-weight="700" fill="#24262b">READ UNCOMMITTED</text>
    <rect x="260" y="330" width="164" height="44" rx="8" fill="#fbe6ed"/><text x="342" y="357" text-anchor="middle" fill="#a3304f">возможно*</text>
    <rect x="430" y="330" width="164" height="44" rx="8" fill="#fbe6ed"/><text x="512" y="357" text-anchor="middle" fill="#a3304f">возможно</text>
    <rect x="600" y="330" width="164" height="44" rx="8" fill="#fbe6ed"/><text x="682" y="357" text-anchor="middle" fill="#a3304f">возможно</text>
    <rect x="770" y="330" width="166" height="44" rx="8" fill="#fbe6ed"/><text x="853" y="357" text-anchor="middle" fill="#a3304f">возможно</text>

    <rect x="24" y="380" width="230" height="44" rx="8" fill="#f6f5f1"/><text x="40" y="400" font-weight="700" fill="#24262b">READ COMMITTED</text><text x="40" y="416" font-size="11.5" fill="#6b6f78">PostgreSQL, Oracle по умолчанию</text>
    <rect x="260" y="380" width="164" height="44" rx="8" fill="#e3f5ec"/><text x="342" y="407" text-anchor="middle" fill="#137a52">нет</text>
    <rect x="430" y="380" width="164" height="44" rx="8" fill="#fbe6ed"/><text x="512" y="407" text-anchor="middle" fill="#a3304f">возможно</text>
    <rect x="600" y="380" width="164" height="44" rx="8" fill="#fbe6ed"/><text x="682" y="407" text-anchor="middle" fill="#a3304f">возможно</text>
    <rect x="770" y="380" width="166" height="44" rx="8" fill="#fbe6ed"/><text x="853" y="407" text-anchor="middle" fill="#a3304f">возможно</text>

    <rect x="24" y="430" width="230" height="44" rx="8" fill="#f6f5f1"/><text x="40" y="450" font-weight="700" fill="#24262b">REPEATABLE READ</text><text x="40" y="466" font-size="11.5" fill="#6b6f78">MySQL InnoDB по умолчанию</text>
    <rect x="260" y="430" width="164" height="44" rx="8" fill="#e3f5ec"/><text x="342" y="457" text-anchor="middle" fill="#137a52">нет</text>
    <rect x="430" y="430" width="164" height="44" rx="8" fill="#e3f5ec"/><text x="512" y="457" text-anchor="middle" fill="#137a52">нет</text>
    <rect x="600" y="430" width="164" height="44" rx="8" fill="#fcf0dc"/><text x="682" y="457" text-anchor="middle" fill="#9a5c06">по стандарту да**</text>
    <rect x="770" y="430" width="166" height="44" rx="8" fill="#fbe6ed"/><text x="853" y="457" text-anchor="middle" fill="#a3304f">возможно</text>

    <rect x="24" y="480" width="230" height="44" rx="8" fill="#f6f5f1"/><text x="40" y="507" font-weight="700" fill="#24262b">SERIALIZABLE</text>
    <rect x="260" y="480" width="164" height="44" rx="8" fill="#e3f5ec"/><text x="342" y="507" text-anchor="middle" fill="#137a52">нет</text>
    <rect x="430" y="480" width="164" height="44" rx="8" fill="#e3f5ec"/><text x="512" y="507" text-anchor="middle" fill="#137a52">нет</text>
    <rect x="600" y="480" width="164" height="44" rx="8" fill="#e3f5ec"/><text x="682" y="507" text-anchor="middle" fill="#137a52">нет</text>
    <rect x="770" y="480" width="166" height="44" rx="8" fill="#e3f5ec"/><text x="853" y="507" text-anchor="middle" fill="#137a52">нет</text>
  </g>
  <text x="24" y="552" font-size="12.5" fill="#24262b">* в PostgreSQL READ UNCOMMITTED работает как READ COMMITTED — грязного чтения там не бывает.</text>
  <text x="24" y="572" font-size="12.5" fill="#24262b">** PostgreSQL на REPEATABLE READ (снимок) не допускает фантомов; MySQL InnoDB защищает от них блокировками диапазонов.</text>
  <text x="24" y="592" font-size="12.5" fill="#24262b">Выше уровень — меньше аномалий, но больше блокировок и откатов; на SERIALIZABLE повторяйте транзакцию при ошибке.</text>
</svg>
