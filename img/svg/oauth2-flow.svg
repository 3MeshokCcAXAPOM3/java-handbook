<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Inter, Arial, sans-serif">
  <rect width="960" height="640" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b6f78"/></marker></defs>
  <text x="480" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#24262b">OAuth 2.0 Authorization Code + PKCE (вход через OIDC)</text>

  <!-- участники -->
  <g text-anchor="middle">
    <rect x="30" y="56" width="170" height="54" rx="12" fill="#f6f5f1" stroke="#9a9ea6"/><text x="115" y="80" font-size="14" font-weight="700" fill="#24262b">Пользователь</text><text x="115" y="98" font-size="12" fill="#6b6f78">браузер</text>
    <rect x="270" y="56" width="190" height="54" rx="12" fill="#e9edfe" stroke="#4f6bed"/><text x="365" y="80" font-size="14" font-weight="700" fill="#3149c4">Client</text><text x="365" y="98" font-size="12" fill="#6b6f78">приложение, BFF</text>
    <rect x="530" y="56" width="190" height="54" rx="12" fill="#fcf0dc" stroke="#d98a1c"/><text x="625" y="80" font-size="14" font-weight="700" fill="#9a5c06">Authorization Server</text><text x="625" y="98" font-size="12" fill="#6b6f78">Keycloak, Okta, Entra ID</text>
    <rect x="770" y="56" width="166" height="54" rx="12" fill="#e3f5ec" stroke="#1f9d6b"/><text x="853" y="80" font-size="14" font-weight="700" fill="#137a52">Resource Server</text><text x="853" y="98" font-size="12" fill="#6b6f78">ваш API</text>
  </g>
  <g stroke="#d6d2c6" stroke-width="2" stroke-dasharray="5 5">
    <line x1="115" y1="110" x2="115" y2="560"/><line x1="365" y1="110" x2="365" y2="560"/><line x1="625" y1="110" x2="625" y2="560"/><line x1="853" y1="110" x2="853" y2="560"/>
  </g>
  <g font-size="12.5" fill="#24262b">
    <line x1="115" y1="140" x2="361" y2="140" stroke="#6b6f78" stroke-width="2" marker-end="url(#a)"/>
    <text x="126" y="133">1. «Войти»</text>
    <line x1="365" y1="182" x2="619" y2="182" stroke="#6b6f78" stroke-width="2" marker-end="url(#a)"/>
    <text x="376" y="164">2. редирект на /authorize:</text>
    <text x="376" y="177" font-size="11.5" fill="#6b6f78">client_id, scope, state, code_challenge</text>
    <line x1="621" y1="222" x2="119" y2="222" stroke="#6b6f78" stroke-width="2" marker-end="url(#a)"/>
    <text x="300" y="215">3. страница входа, согласие на доступ</text>
    <line x1="115" y1="262" x2="621" y2="262" stroke="#6b6f78" stroke-width="2" marker-end="url(#a)"/>
    <text x="126" y="255">4. логин, пароль, MFA — только на сервере авторизации</text>
    <line x1="621" y1="304" x2="369" y2="304" stroke="#d98a1c" stroke-width="2" marker-end="url(#a)"/>
    <text x="380" y="297">5. редирект с одноразовым code</text>
    <line x1="365" y1="350" x2="621" y2="350" stroke="#4f6bed" stroke-width="2" marker-end="url(#a)"/>
    <text x="376" y="333">6. POST /token: code + code_verifier</text>
    <text x="376" y="345" font-size="11.5" fill="#6b6f78">(серверный канал, не через браузер)</text>
    <line x1="621" y1="404" x2="369" y2="404" stroke="#1f9d6b" stroke-width="2" marker-end="url(#a)"/>
    <text x="380" y="374">7. access_token (JWT), refresh_token,</text>
    <text x="380" y="390">id_token — данные пользователя (OIDC)</text>
    <line x1="365" y1="440" x2="849" y2="440" stroke="#1f9d6b" stroke-width="2" marker-end="url(#a)"/>
    <text x="376" y="432">8. GET /orders · Authorization: Bearer &lt;access_token&gt;</text>
    <path d="M853 460 C 900 470, 900 500, 857 506" fill="none" stroke="#6b6f78" stroke-width="2" marker-end="url(#a)"/>
    <text x="670" y="482">9. проверка подписи по JWKS,</text>
    <text x="670" y="498">срока, aud, iss, scope</text>
    <line x1="849" y1="540" x2="369" y2="540" stroke="#6b6f78" stroke-width="2" marker-end="url(#a)"/>
    <text x="560" y="532">10. 200 OK или 401 / 403</text>
  </g>

  <rect x="24" y="572" width="912" height="56" rx="12" fill="#f6f5f1"/>
  <text x="40" y="594" font-size="12.5" fill="#24262b"><tspan font-weight="700">PKCE:</tspan> code_challenge = SHA-256(code_verifier) — перехваченный code бесполезен без секрета, который знает только клиент.</text>
  <text x="40" y="614" font-size="12.5" fill="#24262b"><tspan font-weight="700">Сервис-сервис:</tspan> client_credentials без пользователя. Implicit и Password grant устарели (OAuth 2.1). В Spring: oauth2Login(), oauth2ResourceServer().</text>
</svg>
