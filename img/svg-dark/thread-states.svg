<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Inter, Arial, sans-serif">
  <rect width="960" height="600" fill="#1c1f26"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a909c"/></marker></defs>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#e3e5ea">Состояния потока (Thread.State)</text>

  <!-- состояния -->
  <rect x="30" y="250" width="150" height="70" rx="35" fill="#23272f" stroke="#6d7380" stroke-width="2"/>
  <text x="105" y="291" text-anchor="middle" font-size="18" font-weight="700" fill="#e3e5ea">NEW</text>
  <rect x="370" y="232" width="220" height="106" rx="20" fill="#17352a" stroke="#1f9d6b" stroke-width="2.5"/>
  <text x="480" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#3ccf94">RUNNABLE</text>
  <text x="480" y="294" text-anchor="middle" font-size="12.5" fill="#e3e5ea">готов или выполняется;</text>
  <text x="480" y="312" text-anchor="middle" font-size="12.5" fill="#e3e5ea">блокирующий I/O — тоже здесь</text>
  <rect x="780" y="250" width="150" height="70" rx="35" fill="#3a3f4b"/>
  <text x="855" y="291" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">TERMINATED</text>
  <rect x="380" y="74" width="200" height="70" rx="16" fill="#3d1f2a" stroke="#c2456b" stroke-width="2"/>
  <text x="480" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#f07399">BLOCKED</text>
  <text x="480" y="126" text-anchor="middle" font-size="12.5" fill="#e3e5ea">ждёт монитор synchronized</text>
  <rect x="110" y="440" width="250" height="84" rx="16" fill="#252c47" stroke="#4f6bed" stroke-width="2"/>
  <text x="235" y="472" text-anchor="middle" font-size="18" font-weight="700" fill="#a9b8ff">WAITING</text>
  <text x="235" y="496" text-anchor="middle" font-size="12.5" fill="#e3e5ea">ждёт без ограничения времени</text>
  <rect x="600" y="440" width="250" height="84" rx="16" fill="#3a2d16" stroke="#d98a1c" stroke-width="2"/>
  <text x="725" y="472" text-anchor="middle" font-size="18" font-weight="700" fill="#f0b04a">TIMED_WAITING</text>
  <text x="725" y="496" text-anchor="middle" font-size="12.5" fill="#e3e5ea">ждёт с таймаутом</text>

  <!-- переходы -->
  <line x1="180" y1="285" x2="366" y2="285" stroke="#9aa0ac" stroke-width="2" marker-end="url(#a)"/>
  <text x="273" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#e3e5ea" font-family="Consolas, monospace">start()</text>
  <line x1="590" y1="285" x2="776" y2="285" stroke="#9aa0ac" stroke-width="2" marker-end="url(#a)"/>
  <text x="683" y="270" text-anchor="middle" font-size="13" fill="#e3e5ea">run() завершился</text>
  <text x="683" y="306" text-anchor="middle" font-size="13" fill="#e3e5ea">или исключение</text>

  <line x1="455" y1="230" x2="455" y2="148" stroke="#c2456b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="505" y1="148" x2="505" y2="228" stroke="#1f9d6b" stroke-width="2" marker-end="url(#a)"/>
  <text x="446" y="186" text-anchor="end" font-size="13" fill="#e3e5ea">вход в synchronized,</text>
  <text x="446" y="203" text-anchor="end" font-size="13" fill="#e3e5ea">монитор занят</text>
  <text x="514" y="186" font-size="13" fill="#e3e5ea">монитор</text>
  <text x="514" y="203" font-size="13" fill="#e3e5ea">освободился</text>

  <path d="M395 338 L 250 436" fill="none" stroke="#4f6bed" stroke-width="2" marker-end="url(#a)"/>
  <path d="M290 440 L 425 340" fill="none" stroke="#1f9d6b" stroke-width="2" marker-end="url(#a)"/>
  <text x="70" y="364" font-size="13" fill="#e3e5ea" font-family="Consolas, monospace">wait(), join(),</text>
  <text x="70" y="382" font-size="13" fill="#e3e5ea" font-family="Consolas, monospace">LockSupport.park(),</text>
  <text x="70" y="400" font-size="13" fill="#e3e5ea" font-family="Consolas, monospace">lock() у ReentrantLock</text>
  <text x="352" y="408" font-size="13" fill="#e3e5ea">notify(), unpark(),</text>
  <text x="352" y="425" font-size="13" fill="#e3e5ea">поток завершился</text>

  <path d="M565 338 L 700 436" fill="none" stroke="#d98a1c" stroke-width="2" marker-end="url(#a)"/>
  <path d="M660 440 L 535 340" fill="none" stroke="#1f9d6b" stroke-width="2" marker-end="url(#a)"/>
  <text x="712" y="364" font-size="13" fill="#e3e5ea" font-family="Consolas, monospace">sleep(ms), wait(ms),</text>
  <text x="712" y="382" font-size="13" fill="#e3e5ea" font-family="Consolas, monospace">join(ms),</text>
  <text x="712" y="400" font-size="13" fill="#e3e5ea" font-family="Consolas, monospace">parkNanos(…)</text>
  <text x="586" y="384" text-anchor="end" font-size="13" fill="#e3e5ea">таймаут</text>
  <text x="586" y="401" text-anchor="end" font-size="13" fill="#e3e5ea">или notify()</text>

  <rect x="30" y="548" width="900" height="40" rx="10" fill="#23272f"/>
  <text x="480" y="573" text-anchor="middle" font-size="13.5" fill="#e3e5ea">После wait() поток сначала снова захватывает монитор (может побыть в BLOCKED). Состояние смотрят в thread dump: jcmd PID Thread.print</text>
</svg>
